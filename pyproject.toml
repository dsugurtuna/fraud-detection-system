[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-system"
version = "2.0.0"
description = "Value-weighted fraud detection with CatBoost, isotonic calibration, and expected-value ranking."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Ugur Tuna"}]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "catboost>=1.2",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "python-pptx>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
