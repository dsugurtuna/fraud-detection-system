[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-system"
version = "2.0.0"
description = "Value-weighted fraud detection with CatBoost, isotonic calibration and expected-value ranking."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Ugur Tuna"}]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "catboost>=1.2",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.9", "mypy>=1.11"]
# Only the original script in legacy/ needs these (plots and a slide deck).
legacy = ["matplotlib>=3.7", "python-pptx>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
# legacy/ holds the original script, kept as published for reference.
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
# pandas, scikit-learn and CatBoost ship without complete type stubs.
ignore_missing_imports = true
